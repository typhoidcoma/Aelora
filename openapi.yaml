  /api/memory/scope:
    get:
      tags: [Memory]
      summary: Get facts for a specific scope
      description: Returns all facts for a single scope. Useful for fetching a specific user's or channel's facts without loading all memory.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: "Scope key (e.g. user:123, channel:456, global)"
          example: "user:987654321098765432"
      responses:
        "200":
          description: Facts for the scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: string
                  facts:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryFact"
                example:
                  scope: "user:987654321098765432"
                  facts:
                    - fact: "Prefers TypeScript over JavaScript for new projects"
                      savedAt: "2026-04-17T11:20:00.000Z"
                      category: "preference"
                      confidence: "stated"
                      source: "channel:1234567890123456789"
                      accessCount: 5
        "400":
          description: Missing name parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "name is required"

  /api/memory/{scope}/{index}:
    delete:
      tags: [Memory]
      summary: Delete a specific fact
      parameters:
        - name: scope
          in: path
          required: true
          schema:
            type: string
          description: "Scope key (e.g. user:123, channel:456, global)"
          example: "user:987654321098765432"
        - name: index
          in: path
          required: true
          schema:
            type: integer
          example: 2
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
                example:
                  success: true
        "404":
          description: Fact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "Fact not found"

  /api/memory/{scope}:
    delete:
      tags: [Memory]
      summary: Clear all facts in a scope
      parameters:
        - name: scope
          in: path
          required: true
          schema:
            type: string
          example: "user:987654321098765432"
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deleted:
                    type: integer
                example:
                  success: true
                  deleted: 14

