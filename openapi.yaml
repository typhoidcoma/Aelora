  # â”€â”€ Calendar â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/calendar/events:
    get:
      tags: [Calendar]
      summary: List upcoming events
      description: Returns upcoming events from the Google Calendar API.
      parameters:
        - name: maxResults
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Maximum number of events to return
        - name: daysAhead
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 14
          description: How many days ahead to query
      responses:
        "200":
          description: List of upcoming events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/CalendarEvent"
                  count:
                    type: integer
                  daysAhead:
                    type: integer
                  maxResults:
                    type: integer
        "502":
          description: Google Calendar API error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "503":
          description: Google Calendar not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/calendar/all-events:
    get:
      tags: [Calendar]
      summary: List events from all user calendars
      description: |
        Aggregates upcoming events across all registered users' calendars.
        Returns a merged, chronologically sorted list. Does not require a user ID.
      parameters:
        - name: maxResults
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Maximum total events to return (across all users)
        - name: daysAhead
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 14
          description: How many days ahead to query
      responses:
        “200”:
          description: Aggregated event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        uid:
                          type: string
                        summary:
                          type: string
                        description:
                          type: string
                        location:
                          type: string
                        dtstart:
                          type: string
                        dtend:
                          type: string
                        user:
                          type: object
                          properties:
                            userId:
                              type: string
                            username:
                              type: string
                  count:
                    type: integer
                  daysAhead:
                    type: integer
        “404”:
          description: Calendar tool not enabled
        “500”:
          description: Calendar query failed
        “503”:
          description: Google not configured

  # â”€â”€ Tasks (Google Tasks) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/tasks:
    get:
      tags: [Tasks]
      summary: List all tasks
      description: Returns tasks from Google Tasks. Filter by status.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, completed]
            default: all
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TodoItem"
                  count:
                    type: integer
        "502":
          description: Google API connection error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Google not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum: [low, medium, high]
                dueDate:
                  type: string
                  format: date-time
              required: [title]
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoItem"
        "400":
          description: Missing title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Google API connection error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tasks/{uid}:
    get:
      tags: [Tasks]
      summary: Get a single task
      parameters:
        - name: uid
          in: path
          required: true
          description: Google Tasks ID of the task
          schema:
            type: string
      responses:
        "200":
          description: Task item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Tasks]
      summary: Update a task
      parameters:
        - name: uid
          in: path
          required: true
          description: Google Tasks ID of the task
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum: [low, medium, high]
                dueDate:
                  type: string
                  format: date-time
                completed:
                  type: boolean
                  description: Set to true to mark as completed
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Tasks]
      summary: Delete a task
      parameters:
        - name: uid
          in: path
          required: true
          description: Google Tasks ID of the task
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

