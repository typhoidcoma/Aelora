  # â”€â”€ Scoring â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /api/tokens:
    get:
      tags: [Tokens]
      summary: Get token usage statistics
      description: |
        Returns LLM token usage stats including lifetime totals, today's usage, hourly buckets (48h rolling),
        and breakdowns by model and source.

        `cachedTokens` is a subset of `inputTokens` that was served from the provider's prompt cache
        (OpenAI `usage.prompt_tokens_details.cached_tokens` or Anthropic `usage.cache_read_input_tokens`).
        It is additive — the canonical input-token meter stays `inputTokens`; do not subtract.
      responses:
        "200":
          description: Token usage statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  lifetime:
                    type: object
