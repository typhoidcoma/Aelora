  # â”€â”€ Tools â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/tools:
    get:
      tags: [Tools]
      summary: List all tools
      responses:
        "200":
          description: Tool list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tool"

  /api/tools/{name}:
    get:
      tags: [Tools]
      summary: Get a single tool's details
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tool detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tools/{name}/execute:
    post:
      tags: [Tools]
      summary: Execute a tool directly
      description: |
        Call any enabled tool with arguments. Uses the same execution path
        as LLM tool calls. Optional channelId and userId provide context
        for scoped tools (memory, notes, etc.).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                args:
                  type: object
                  description: Tool arguments (varies per tool, see tool's parameters schema)
                channelId:
                  type: string
                  nullable: true
                  description: Optional channel context for scoped tools
                userId:
                  type: string
                  nullable: true
                  description: Optional user context for scoped tools
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tool:
                    type: string
                  result:
                    type: string
                    description: Human-readable text result (always present, backward compatible)
                  data:
                    description: >
                      Structured JSON data for the tool response. Shape varies per tool and action.
                      Present when the tool provides structured output. Omitted on error responses.
                      Typically includes an `action` field and typed result objects.
        "400":
          description: Tool is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Tool not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tools/{name}/toggle:
    post:
      tags: [Tools]
      summary: Toggle a tool on/off
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Toggle result
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  enabled:
                    type: boolean
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

