openapi: 3.1.0
info:
  title: Aelora API
  version: 1.0.0
  description: |
    REST API for the Aelora bot platform. Powers the web dashboard and can be used
    by external services to manage personas, memory, scheduled tasks, and more.

    ## Authentication

    When `web.apiKey` is set in `settings.yaml`, non-public routes require:

    ```
    Authorization: Bearer <your-api-key>
    ```

    Query-token auth (`?token=<key>`) is still supported for compatibility and for
    EventSource clients that cannot set headers, but it is deprecated.

    ```
    GET /api/logs/stream?token=<your-api-key>
    ```

    If no API key is configured, public routes stay open and sensitive routes are
    restricted to local requests only (for example `/api/reboot`, `/api/export`,
    and persona file mutation routes).

    ## Rate Limiting

    - **General:** 1000 requests / 15 minutes per IP on all `/api/*` routes
    - **Chat:** 60 requests / minute per IP on `/api/chat` and `/api/chat/stream`

    Rate limit headers (`RateLimit-*`) are included in responses.

servers:
  - url: /
    description: Current server (auto-detect)
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Status
    description: Health check and bot state
  - name: Config
    description: Bot configuration (sanitized, no secrets)
  - name: Persona
    description: Persona management, file editing, switching
  - name: Chat
    description: Conversation API with full session state (rate limited to 60/min)
  - name: Cron
    description: Scheduled task management
  - name: Sessions
    description: Conversation session analytics
  - name: Memory
    description: Fact storage, daily logs, conversation summaries
  - name: Notes
    description: Persistent note storage with scope-based organization
  - name: Calendar
    description: Google Calendar event management
  - name: Tasks
    description: Task management via Google Tasks
  - name: Users
    description: User profile tracking across channels
  - name: Tools
    description: Tool registry management
  - name: Agents
    description: Agent registry management
  - name: System
    description: Heartbeat, logs, reboot
  - name: Export
    description: Data export (full or selective JSON bundle)
  - name: Activity
    description: Discord Activity (Unity WebGL) support
  - name: Scoring
    description: Task scoring system, leaderboard, achievements, and life events
  - name: Linear
    description: Linear project management integration (issues, projects, teams)
  - name: Knowledge Base
    description: Google Drive knowledge base sync, search, and file management
  - name: Ambient
    description: Ambient awareness engine status, buffers, and trigger management
  - name: WebSocket
    description: |
      Real-time bidirectional chat via WebSocket at `ws://host:port/ws`.

      **Connection:** prefer bearer auth (if the client supports headers).
      Query-token (`?token=...`) remains available for compatibility and can be
      disabled with `web.auth.allowWsQueryToken`.

      **Protocol (JSON):**
      Client -> Server:
      - `{ "type": "init", "sessionId": "...", "userId?": "...", "username?": "..." }` - bind session
      - `{ "type": "message", "content": "..." }` - send chat message
      - `{ "type": "clear" }` - start new session (clears history, summary, context, and session stats)
      - `{ "type": "presence", "status": "online|idle|offline" }` - report user presence (updates activity tracking)

      Server -> Client:
      - `{ "type": "ready", "sessionId": "..." }` - session bound
      - `{ "type": "token", "content": "..." }` - streamed response chunk
      - `{ "type": "done", "reply": "..." }` - full response
      - `{ "type": "error", "error": "..." }` - error message
      - `{ "type": "event", "event": "mood", "data": {...} }` - live broadcast event

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    QueryToken:
      type: apiKey
      in: query
      name: token

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Success:
      type: object
      properties:
        success:
          type: boolean

    Status:
      type: object
      properties:
        connected:
          type: boolean
        username:
          type: string
          nullable: true
        userId:
          type: string
          nullable: true
        guildCount:
          type: integer
        uptime:
          type: number
          description: Seconds since boot
        authRequired:
          type: boolean
        liveClients:
          type: object
          properties:
            sseClients:
              type: integer
            wsClients:
              type: integer
            maxSseClients:
              type: integer
            maxWsClients:
              type: integer

    CronJob:
      type: object
      properties:
        name:
          type: string
        schedule:
          type: string
          description: Cron expression (e.g. "0 9 * * *")
        timezone:
          type: string
        channelId:
          type: string
        type:
          type: string
          enum: [static, llm]
        message:
          type: string
          description: Static message (when type=static)
        prompt:
          type: string
          description: LLM prompt (when type=llm)
        enabled:
          type: boolean
        silent:
          type: boolean
          description: When true, job runs without sending output to Discord. History is still recorded.
        lastRun:
          type: string
          format: date-time
          nullable: true
        nextRun:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        history:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              success:
                type: boolean
              durationMs:
                type: integer
              outputPreview:
                type: string
              error:
                type: string

    Session:
      type: object
      properties:
        channelId:
          type: string
        channelName:
          type: string
        guildId:
          type: string
          nullable: true
        messageCount:
          type: integer
        firstMessage:
          type: string
          format: date-time
        lastMessage:
          type: string
          format: date-time
        users:
          type: object
          additionalProperties:
            type: object
            properties:
              username:
                type: string
              messageCount:
                type: integer
              lastMessage:
                type: string
                format: date-time

    MemoryFact:
      type: object
      required: [fact, savedAt, category, confidence, source]
      properties:
        fact:
          type: string
        savedAt:
          type: string
          format: date-time
        category:
          type: string
          enum: [preference, biographical, behavioral, relationship, technical, contextual]
          description: Classification of what the fact represents
        confidence:
          type: string
          enum: [stated, inferred]
          description: Whether the user explicitly stated this or it was inferred from context
        source:
          type: string
          description: "Origin of the fact (e.g. channel:123, manual, legacy, consolidation)"
        lastAccessedAt:
          type: string
          format: date-time
          description: Last time this fact was injected into the system prompt
        accessCount:
          type: integer
          description: Number of times this fact has been injected into the system prompt

    Tool:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        parameters:
          type: object
          nullable: true
          description: JSON Schema for tool arguments (OpenAI function calling format)

    Agent:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        tools:
          type: array
          items:
            type: string
        maxIterations:
          type: integer
          nullable: true
        model:
          type: string
          nullable: true

    PersonaFile:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
        meta:
          type: object
          properties:
            label:
              type: string
            section:
              type: string
            order:
              type: integer
            enabled:
              type: boolean
            description:
              type: string
            botName:
              type: string

    LogEntry:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [log, warn, error]
        message:
          type: string

    Note:
      type: object
      properties:
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [content, createdAt, updatedAt]

    CalendarEvent:
      type: object
      properties:
        uid:
          type: string
        summary:
          type: string
        description:
          type: string
        location:
          type: string
        dtstart:
          type: string
          format: date-time
          description: Event start in ISO 8601
        dtend:
          type: string
          format: date-time
          description: Event end in ISO 8601
        url:
          type: string
          description: Google Calendar event URL
        etag:
          type: string

    BufferStats:
      type: object
      properties:
        channelId:
          type: string
        channelName:
          type: string
        messageCount:
          type: integer
        oldestMessage:
          type: number
          nullable: true
          description: Unix timestamp of oldest buffered message
        newestMessage:
          type: number
          nullable: true
          description: Unix timestamp of newest buffered message
        lastAmbientSendAt:
          type: number
          description: Unix timestamp of last ambient message sent to this channel

    UserProfile:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
          description: Latest Discord display name
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        messageCount:
          type: integer
        channels:
          type: array
          items:
            type: string
          description: Channel IDs the user has been active in
      required: [userId, username, firstSeen, lastSeen, messageCount, channels]

    TodoItem:
      type: object
      description: A task from Google Tasks
      properties:
        uid:
          type: string
          description: Google Tasks ID (use for complete/update/delete)
        title:
          type: string
        description:
          type: string
          nullable: true
        completed:
          type: boolean
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
          description: Google Calendar event URL
        etag:
          type: string
          description: ETag for conflict detection
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required: [uid, title, completed, priority, url, etag]

security:
  - BearerAuth: []

paths:
  # â”€â”€ Docs â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/docs:
    get:
      tags: [Status]
      summary: Interactive API documentation
      description: Swagger UI for exploring and testing the API. Always public.
      security: []
      responses:
        "200":
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

  /api/docs/openapi.yaml:
    get:
      tags: [Status]
      summary: OpenAPI specification
      description: Raw OpenAPI 3.1 YAML specification. Always public.
      security: []
      responses:
        "200":
          description: OpenAPI YAML
          content:
            text/yaml:
              schema:
                type: string

  # â”€â”€ Status â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/status:
    get:
      tags: [Status]
      summary: Bot status
      description: Connection state, uptime, guild count, and whether auth is required. Always public.
      security: []
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  # â”€â”€ Config â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/config:
    get:
      tags: [Config]
      summary: Sanitized config
      description: Returns bot configuration with secrets stripped.
      responses:
        "200":
          description: Config object
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # â”€â”€ Persona â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/persona:
    get:
      tags: [Persona]
      summary: Active persona state
      description: File inventory, prompt stats, and active persona info.
      responses:
        "200":
          description: Persona state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  activePersona:
                    type: string
                  botName:
                    type: string
                  loadedAt:
                    type: string
                    format: date-time
                  promptLength:
                    type: integer
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        label:
                          type: string
                        section:
                          type: string
                        order:
                          type: integer
                        enabled:
                          type: boolean
                        contentLength:
                          type: integer

  /api/persona/reload:
    post:
      tags: [Persona]
      summary: Reload persona from disk
      description: Hot-reloads all persona files and recomposes the system prompt.
      responses:
        "200":
          description: Reload result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  activePersona:
                    type: string
                  botName:
                    type: string
                  promptLength:
                    type: integer
                  fileCount:
                    type: integer
                  enabledCount:
                    type: integer

  /api/personas:
    get:
      tags: [Persona]
      summary: List all personas
      description: Returns all available personas with descriptions for the card grid.
      responses:
        "200":
          description: Persona list
          content:
            application/json:
              schema:
                type: object
                properties:
                  personas:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        botName:
                          type: string
                        description:
                          type: string
                        fileCount:
                          type: integer
                  activePersona:
                    type: string
    post:
      tags: [Persona]
      summary: Create a new persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Folder name (lowercase, hyphens)
                description:
                  type: string
                botName:
                  type: string
                  description: Character display name
              required: [name]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/persona/switch:
    post:
      tags: [Persona]
      summary: Switch active persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                persona:
                  type: string
              required: [persona]
      responses:
        "200":
          description: Switched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  activePersona:
                    type: string
                  botName:
                    type: string
                  promptLength:
                    type: integer

  /api/persona/files:
    get:
      tags: [Persona]
      summary: List all persona files
      description: Returns all files across all personas with content.
      responses:
        "200":
          description: File list
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/PersonaFile"

  /api/persona/file:
    get:
      tags: [Persona]
      summary: Get a persona file
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Relative path (e.g. "aelora/persona.md")
      responses:
        "200":
          description: File content and metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaFile"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Persona]
      summary: Create a new persona file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                content:
                  type: string
                meta:
                  type: object
              required: [path]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "403":
          description: Sensitive route blocked when API key is unset and request is non-local
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Persona]
      summary: Update a persona file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                content:
                  type: string
                meta:
                  type: object
              required: [path, content]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "403":
          description: Sensitive route blocked when API key is unset and request is non-local
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Persona]
      summary: Delete a persona file
      description: |
        Path can be provided either as a query parameter or in the request body.
        Query parameter takes precedence if both are supplied.
      parameters:
        - name: path
          in: query
          schema:
            type: string
          description: Relative path (e.g. "aelora/notes.md"). Alternative to request body.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
              required: [path]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "403":
          description: Sensitive route blocked when API key is unset and request is non-local
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # â”€â”€ Chat â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/chat:
    post:
      tags: [Chat]
      summary: Send a message
      description: |
        Send a message and receive a response with full conversation state.
        Uses `sessionId` to maintain conversation history across requests.
        Optionally provide `userId` and `username` to enable user-scoped memory and session tracking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, sessionId]
              properties:
                message:
                  type: string
                  description: The user's message
                sessionId:
                  type: string
                  description: Conversation identifier (maps to internal channelId)
                userId:
                  type: string
                  description: Optional user identifier for memory and tracking
                username:
                  type: string
                  description: Optional display name (required if userId is provided)
      responses:
        "200":
          description: Bot response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                  sessionId:
                    type: string
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/chat/stream:
    post:
      tags: [Chat]
      summary: Send a message (streaming)
      description: |
        Same as POST /api/chat but streams tokens via Server-Sent Events.
        Each token is sent as `data: {"token":"..."}`.
        Final event is `data: {"done":true,"reply":"..."}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, sessionId]
              properties:
                message:
                  type: string
                sessionId:
                  type: string
                userId:
                  type: string
                username:
                  type: string
      responses:
        "200":
          description: SSE stream of tokens
          content:
            text/event-stream:
              schema:
                type: string
        "413":
          description: Message too large (max server-side length exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/chat/{sessionId}:
    delete:
      tags: [Chat]
      summary: Start new session
      description: Full session reset. Clears conversation history, summary, compaction queue, and session stats. The next message starts fresh.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
          description: The session to reset
      responses:
        "200":
          description: Session reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # â”€â”€ Cron â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/cron:
    get:
      tags: [Cron]
      summary: List all cron jobs
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CronJob"
    post:
      tags: [Cron]
      summary: Create a cron job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                schedule:
                  type: string
                timezone:
                  type: string
                channelId:
                  type: string
                  description: Required unless silent is true
                type:
                  type: string
                  enum: [static, llm]
                message:
                  type: string
                prompt:
                  type: string
                enabled:
                  type: boolean
                silent:
                  type: boolean
                  description: Run without sending output to Discord
              required: [name, schedule, type]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cron/{name}:
    put:
      tags: [Cron]
      summary: Update a cron job
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule:
                  type: string
                timezone:
                  type: string
