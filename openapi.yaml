                  "987654321098765432":
                    userId: "987654321098765432"
                    username: "tess"
                    firstSeen: "2026-03-01T10:00:00.000Z"
                    lastSeen: "2026-04-18T14:32:00.000Z"
                    messageCount: 412
                    channels:
                      - "1234567890123456789"

  /api/users/{userId}:
    get:
      tags: [Users]
      summary: Get user profile with memory facts
      description: Returns a user's profile enriched with their stored memory facts.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: Discord user ID
          example: "987654321098765432"
      responses:
        "200":
          description: User profile with facts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UserProfile"
                  - type: object
                    properties:
                      facts:
                        type: array
                        items:
                          $ref: "#/components/schemas/MemoryFact"
                example:
                  userId: "987654321098765432"
                  username: "tess"
                  firstSeen: "2026-03-01T10:00:00.000Z"
                  lastSeen: "2026-04-18T14:32:00.000Z"
                  messageCount: 412
                  channels:
                    - "1234567890123456789"
                  facts:
                    - fact: "Prefers TypeScript over JavaScript for new projects"
                      savedAt: "2026-04-17T11:20:00.000Z"
                      category: "preference"
                      confidence: "stated"
                      source: "channel:1234567890123456789"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: "User not found"

    delete:
      tags: [Users]
      summary: Delete user profile
      description: Removes a user profile and cascade-deletes their memory facts (user:{userId} scope).
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "987654321098765432"
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                example:
                  success: true
        "404":
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: "User not found"

