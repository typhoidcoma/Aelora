openapi: 3.1.0
info:
  title: Aelora API
  version: 1.0.0
  description: |
    REST API for the Aelora bot platform. Powers the web dashboard and can be used
    by external services to manage personas, memory, scheduled tasks, and more.

    ## Authentication

    When `web.apiKey` is set in `settings.yaml`, non-public routes require:

    ```
    Authorization: Bearer <your-api-key>
    ```

    Query-token auth (`?token=<key>`) is still supported for compatibility and for
    EventSource clients that cannot set headers, but it is deprecated.

    ```
    GET /api/logs/stream?token=<your-api-key>
    ```

    If no API key is configured, public routes stay open and sensitive routes are
    restricted to local requests only (for example `/api/reboot`, `/api/export`,
    and persona file mutation routes).

    ## Rate Limiting

    - **General:** 1000 requests / 15 minutes per IP on all `/api/*` routes
    - **Chat:** 60 requests / minute per IP on all `/api/chat/*` routes (`/api/chat`, `/api/chat/stream`, `/api/chat/system`, `/api/chat/system/stream`)

    Rate limit headers (`RateLimit-*`) are included in responses.

servers:
  - url: /
    description: Current server (auto-detect)
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Status
    description: Health check and bot state
  - name: Config
    description: Bot configuration (sanitized, no secrets)
  - name: Persona
    description: Persona management, file editing, switching
  - name: Chat
    description: Conversation API with full session state (rate limited to 60/min)
  - name: Cron
    description: Scheduled task management
  - name: Sessions
    description: Conversation session analytics
  - name: Memory
    description: Fact storage, daily logs, conversation summaries
  - name: Notes
    description: Persistent note storage with scope-based organization
  - name: Calendar
    description: Google Calendar event management
  - name: Tasks
    description: Task management via Google Tasks
  - name: Users
    description: User profile tracking across channels
  - name: Tools
    description: Tool registry management
  - name: Agents
    description: Agent registry management
  - name: System
    description: Heartbeat, logs, reboot
  - name: Export
    description: Data export (full or selective JSON bundle)
  - name: Activity
    description: Discord Activity (ThreeJS web frontend) support. Unity WebGL was retired; the Activity iframe, OAuth2 flow, and bridge API are unchanged.
  - name: Tokens
    description: LLM token usage tracking and statistics
  - name: Quests
    description: |
      Patyna quests in Supabase (Auth user_id–scoped). Full CRUD via REST and LLM tool.

      **LLM tool actions:** create, complete, list, update, delete, set_favorite.
      The bot asks follow-up questions when creating quests to fill in details.

      **Real-time events:** All quest mutations broadcast a `"quest"` event via SSE/WebSocket:
      ```json
      { "action": "created|completed|updated|deleted", "quest": {...} }
      ```
      Frontend clients (ThreeJS web frontend, dashboard, any WebSocket consumer) listen for `{ type: "event", event: "quest", data }` on `/ws` to update UI without polling.
  - name: Linear
    description: Linear project management integration (issues, projects, teams)
  - name: Knowledge Base
    description: Google Drive knowledge base sync, search, and file management
  - name: Emotion
    description: |
      Real-time continuous emotion vectors for 3D mesh animation (ThreeJS web frontend).
      Uses Plutchik's 8 primary emotions as 0.0–1.0 float dimensions.

      Three sources broadcast `"emotion"` events via SSE/WebSocket:
      - `source: "user"` — immediate heuristic reaction to incoming user text (before LLM processes)
      - `source: "stream"` — heuristic analysis of bot's streaming response (~1-3x/sec)
      - `source: "llm"` — LLM-classified mood converted to vector (after response, 5s cooldown)
  - name: Ambient
    description: Ambient awareness engine status, buffers, and trigger management
  - name: WebSocket
    description: |
      Real-time bidirectional chat + topic-subscribed event bus at `ws://host:port/ws`.

      **Connection:** prefer bearer auth (if the client supports headers).
      Query-token (`?token=...`) remains available for compatibility and can be
      disabled with `web.auth.allowWsQueryToken`.

      **Compression:** server negotiates `permessage-deflate` automatically when
      `web.wsCompression: true` (default). Frames ≥1 KB are compressed.

      **Topics:** the event bus is partitioned into six topics — `chat`,
      `emotion`, `mindmap`, `logs`, `tokens`, `heartbeat`. Clients narrow their
      feed via the `subscribe` message below. Clients that never subscribe keep
      receiving every topic (backward compatibility).

      **Protocol (JSON):**
      Client -> Server:
      - `{ "type": "init", "sessionId": "...", "userId?": "...", "username?": "..." }` - bind session
      - `{ "type": "message", "content": "..." }` - send chat message
      - `{ "type": "clear" }` - start new session (clears history, summary, context, and session stats)
      - `{ "type": "presence", "status": "online|idle|offline" }` - report user presence (updates activity tracking)
      - `{ "type": "subscribe", "topics": ["emotion", "mindmap"], "binary?": true }` - narrow event feed to the listed topics. Optional `binary: true` (for the `emotion` topic) switches that topic's payloads to `Float32Array` frames when `web.wsBinaryEmotion: true`.
      - `{ "type": "unsubscribe", "topics": ["logs"] }` - remove topics from the current subscription

      Server -> Client:
      - `{ "type": "ready", "sessionId": "..." }` - session bound
      - `{ "type": "token", "content": "..." }` - streamed response chunk
      - `{ "type": "done", "reply": "..." }` - full response
      - `{ "type": "error", "error": "..." }` - error message
      - `{ "type": "subscribed", "topics": [...] }` - ack for subscribe/unsubscribe
      - `{ "type": "event", "event": "mood", "data": {...} }` - discrete mood update, routed to `emotion` topic
      - `{ "type": "event", "event": "emotion", "data": {...} }` - continuous emotion vector (8D floats + source: user|stream|llm), routed to `emotion` topic
      - `{ "type": "event", "event": "quest", "data": {...} }` - quest mutation (action: created|completed|updated|deleted + quest row), routed to `heartbeat` topic
      - `{ "type": "event", "event": "tokens:usage", "data": {...} }` - token accounting for the last LLM call, includes `cachedTokens`, routed to `tokens` topic
      - `{ "type": "event", "event": "mindmap", "data": {...} }` - conversation-graph updates (conversation:start / :message / :end, tool:start / :end, memory:search, kb:search), routed to `mindmap` topic
      - Binary frame (when `emotion` subscribed with `binary: true` and server-side `wsBinaryEmotion` enabled) - `Float32Array` packed as `[conversationIdHash, joy, trust, fear, surprise, sadness, disgust, anger, anticipation]`

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    QueryToken:
      type: apiKey
      in: query
      name: token

  schemas:
    EmotionVector:
      type: object
      description: |
        Continuous 8-dimensional emotion vector based on Plutchik's wheel.
        Each dimension ranges from 0.0 (absent) to 1.0 (maximum intensity).
        Multiple dimensions can be active simultaneously for blended emotions.

        When broadcast as an SSE/WebSocket event, includes `source` and optionally `conversationId`.
      properties:
        joy:
          type: number
          minimum: 0
          maximum: 1
        trust:
          type: number
          minimum: 0
          maximum: 1
        fear:
          type: number
          minimum: 0
          maximum: 1
        surprise:
          type: number
          minimum: 0
          maximum: 1
        sadness:
          type: number
          minimum: 0
          maximum: 1
        disgust:
          type: number
          minimum: 0
          maximum: 1
        anger:
          type: number
          minimum: 0
          maximum: 1
        anticipation:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: string
          enum: [user, stream, llm]
          description: |
            What triggered this emotion vector:
            - `user` — heuristic reaction to incoming user text (immediate, before LLM)
            - `stream` — heuristic analysis of bot's streaming response (~1-3x/sec)
            - `llm` — LLM-classified mood converted to vector (after response)
            Only present in SSE/WebSocket broadcasts, not in GET /api/emotion responses.
        conversationId:
          type: string
          nullable: true
          description: |
            Channel or session ID for the conversation that triggered the emotion.
            Present on `user` and `stream` sources. Absent on `llm` source (global bot mood).
            Not present in GET /api/emotion responses.
      required: [joy, trust, fear, surprise, sadness, disgust, anger, anticipation]

    QuestRow:
      type: object
      description: A quest row from the Supabase `quests` table.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
        quest_type:
          type: string
          enum: [daily, milestone, streak]
        target_value:
          type: number
        current_value:
          type: number
        status:
          type: string
        difficulty:
          type: string
        suggested_by:
          type: string
        is_favorite:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true

    QuestEvent:
      type: object
      description: |
        Broadcast via SSE (`"quest"` event) and WebSocket (`{ type: "event", event: "quest", data }`)
        whenever a quest is created, completed, updated, or deleted — from both REST API and LLM tool.
      properties:
        action:
          type: string
          enum: [created, completed, updated, deleted]
          description: What happened to the quest.
        quest:
          $ref: "#/components/schemas/QuestRow"
          description: Full quest row (present for created, completed, updated). Absent for deleted.
        id:
          type: string
          format: uuid
          description: Quest ID (present for deleted).
        title:
          type: string
          description: Quest title (present for deleted).
      required: [action]

    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Success:
      type: object
      properties:
        success:
          type: boolean

    Status:
      type: object
      properties:
        connected:
          type: boolean
        username:
          type: string
          nullable: true
        userId:
          type: string
          nullable: true
        guildCount:
          type: integer
        uptime:
          type: number
          description: Seconds since boot
        authRequired:
          type: boolean
        liveClients:
          type: object
          properties:
            sseClients:
              type: integer
            wsClients:
              type: integer
            maxSseClients:
              type: integer
            maxWsClients:
              type: integer

    CronJob:
      type: object
      properties:
        name:
          type: string
        schedule:
          type: string
          description: Cron expression (e.g. "0 9 * * *")
        timezone:
          type: string
        channelId:
          type: string
        type:
          type: string
          enum: [static, llm]
        message:
          type: string
          description: Static message (when type=static)
        prompt:
          type: string
          description: LLM prompt (when type=llm)
        enabled:
          type: boolean
        silent:
          type: boolean
          description: When true, job runs without sending output to Discord. History is still recorded.
        lastRun:
          type: string
          format: date-time
          nullable: true
        nextRun:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        history:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              success:
                type: boolean
              durationMs:
                type: integer
              outputPreview:
                type: string
              error:
                type: string

    Session:
      type: object
      properties:
        channelId:
          type: string
        channelName:
          type: string
        guildId:
          type: string
          nullable: true
        messageCount:
          type: integer
        firstMessage:
          type: string
          format: date-time
        lastMessage:
          type: string
          format: date-time
        users:
          type: object
          additionalProperties:
            type: object
            properties:
              username:
                type: string
              messageCount:
                type: integer
              lastMessage:
                type: string
                format: date-time

    MemoryFact:
      type: object
      required: [fact, savedAt, category, confidence, source]
      properties:
        fact:
          type: string
        savedAt:
          type: string
          format: date-time
        category:
          type: string
          enum: [preference, biographical, behavioral, relationship, technical, contextual]
          description: Classification of what the fact represents
        confidence:
          type: string
          enum: [stated, inferred]
          description: Whether the user explicitly stated this or it was inferred from context
        source:
          type: string
          description: "Origin of the fact (e.g. channel:123, manual, legacy, consolidation)"
        lastAccessedAt:
          type: string
          format: date-time
          description: Last time this fact was injected into the system prompt
        accessCount:
          type: integer
          description: Number of times this fact has been injected into the system prompt

    Tool:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        parameters:
          type: object
          nullable: true
          description: JSON Schema for tool arguments (OpenAI function calling format)

    Agent:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        tools:
          type: array
          items:
            type: string
        maxIterations:
          type: integer
          nullable: true
        model:
          type: string
          nullable: true

    PersonaFile:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
        meta:
          type: object
          properties:
            label:
              type: string
            section:
              type: string
            order:
              type: integer
            enabled:
              type: boolean
            description:
              type: string
            botName:
              type: string

    LogEntry:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [log, warn, error]
        message:
          type: string

    Note:
      type: object
      properties:
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [content, createdAt, updatedAt]

    CalendarEvent:
      type: object
      properties:
        uid:
          type: string
        summary:
          type: string
        description:
          type: string
        location:
          type: string
        dtstart:
          type: string
          format: date-time
          description: Event start in ISO 8601
        dtend:
          type: string
          format: date-time
          description: Event end in ISO 8601
        url:
          type: string
          description: Google Calendar event URL
        etag:
          type: string

    BufferStats:
      type: object
      properties:
        channelId:
          type: string
        channelName:
          type: string
        messageCount:
          type: integer
        oldestMessage:
          type: number
          nullable: true
          description: Unix timestamp of oldest buffered message
        newestMessage:
          type: number
          nullable: true
          description: Unix timestamp of newest buffered message
        lastAmbientSendAt:
          type: number
          description: Unix timestamp of last ambient message sent to this channel

    UserProfile:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
          description: Latest Discord display name
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        messageCount:
          type: integer
        channels:
          type: array
          items:
            type: string
          description: Channel IDs the user has been active in
      required: [userId, username, firstSeen, lastSeen, messageCount, channels]

    TodoItem:
      type: object
      description: A task from Google Tasks
      properties:
        uid:
          type: string
          description: Google Tasks ID (use for complete/update/delete)
        title:
          type: string
        description:
          type: string
          nullable: true
        completed:
          type: boolean
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
          description: Google Calendar event URL
        etag:
          type: string
          description: ETag for conflict detection
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
      required: [uid, title, completed, priority, url, etag]

security:
  - BearerAuth: []

paths:
  # â”€â”€ Docs â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/docs:
    get:
      tags: [Status]
      summary: Interactive API documentation
      description: Swagger UI for exploring and testing the API. Always public.
      security: []
      responses:
        "200":
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

  /api/docs/openapi.yaml:
    get:
      tags: [Status]
      summary: OpenAPI specification
      description: Raw OpenAPI 3.1 YAML specification (this document). Served as `application/yaml`. Always public.
      security: []
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
                example: |
                  openapi: 3.1.0
                  info:
                    title: Aelora API
                    version: 1.0.0
            text/yaml:
              schema:
                type: string
                example: |
                  openapi: 3.1.0
                  info:
                    title: Aelora API
                    version: 1.0.0

  # â”€â”€ Status â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/status:
    get:
      tags: [Status]
      summary: Bot status
      description: Connection state, uptime, guild count, and whether auth is required. Always public.
      security: []
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
                example:
                  connected: true
                  username: "Aelora"
                  userId: "987654321098765432"
                  guildCount: 2
                  uptime: 38412.5
                  authRequired: true
                  liveClients:
                    sseClients: 1
                    wsClients: 3
                    maxSseClients: 50
                    maxWsClients: 50

  /api/health:
    get:
      tags: [Status]
      summary: External API health report
      description: |
        Rolling 1-hour window of external API call outcomes (success/error counts,
        last error, last success, average duration) per service (e.g. `openai`,
        `google`, `supabase`, `linear`). Useful for detecting upstream outages.
      responses:
        "200":
          description: Health report keyed by service name
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    success:
                      type: integer
                      description: Successful calls in the current hour
                    error:
                      type: integer
                      description: Failed calls in the current hour
                    totalDurationMs:
                      type: integer
                      description: Sum of all call durations in ms
                    avgDurationMs:
                      type: integer
                      description: Average call duration across success+error
                    lastError:
                      type: object
                      nullable: true
                      properties:
                        message:
                          type: string
                        at:
                          type: string
                          format: date-time
                    lastSuccess:
                      type: string
                      format: date-time
                      nullable: true
                example:
                  openai:
                    success: 142
                    error: 1
                    totalDurationMs: 58210
                    avgDurationMs: 407
                    lastError:
                      message: "429 Too Many Requests"
                      at: "2026-04-18T14:12:44.112Z"
                    lastSuccess: "2026-04-18T14:32:01.902Z"
                  google:
                    success: 23
                    error: 0
                    totalDurationMs: 4150
                    avgDurationMs: 180
                    lastSuccess: "2026-04-18T14:31:10.224Z"

  /api/supabase/status:
    get:
      tags: [Status]
      summary: Supabase connectivity check
      description: |
        Reports whether Supabase is configured (`supabase.url` + `supabase.anonKey`
        in `settings.yaml`), whether the client initialized, and whether the
        `quests` table is readable (includes RLS/schema probe).
      responses:
        "200":
          description: Supabase status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                    description: Whether supabase.url + anonKey are set in settings.yaml
                  clientReady:
                    type: boolean
                    description: Whether the Supabase client initialized successfully
                  quests:
                    type: object
                    nullable: true
                    properties:
                      readable:
                        type: boolean
                      error:
                        type: string
                      code:
                        type: string
                      hint:
                        type: string
                  questsUseServiceRole:
                    type: boolean
                    description: True when supabase.serviceRoleKey is set (bypasses RLS for quest writes)
                  message:
                    type: string
                    description: Present when configured=false
                example:
                  configured: true
                  clientReady: true
                  quests:
                    readable: true
                  questsUseServiceRole: true

  # â”€â”€ Config â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/config:
    get:
      tags: [Config]
      summary: Sanitized config
      description: Returns bot configuration with secrets stripped.
      responses:
        "200":
          description: Config object
          content:
            application/json:
              schema:
                type: object
                example:
                  persona:
                    active: "wendy"
                    botName: "Wendy"
                  llm:
                    model: "claude-opus-4-7"
                    maxTokens: 4096
                  memory:
                    consolidationEnabled: true
                    triageEnabled: true
                  knowledge:
                    enabled: true
                    syncIntervalMinutes: 30
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "Unauthorized"

  # â”€â”€ Persona â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/persona:
    get:
      tags: [Persona]
      summary: Active persona state
      description: File inventory, prompt stats, and active persona info.
      responses:
        "200":
          description: Persona state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  activePersona:
                    type: string
                  botName:
                    type: string
                  loadedAt:
                    type: string
                    format: date-time
                  promptLength:
                    type: integer
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        label:
                          type: string
                        section:
                          type: string
                        order:
                          type: integer
                        enabled:
                          type: boolean
                        contentLength:
                          type: integer
                example:
                  enabled: true
                  activePersona: "wendy"
                  botName: "Wendy"
                  loadedAt: "2026-04-18T14:00:00.000Z"
                  promptLength: 8421
                  files:
                    - path: "wendy/persona.md"
                      label: "Core persona"
                      section: "identity"
                      order: 1
                      enabled: true
                      contentLength: 2130
                    - path: "wendy/style.md"
                      label: "Voice & style"
                      section: "identity"
                      order: 2
                      enabled: true
                      contentLength: 1021

  /api/persona/reload:
    post:
      tags: [Persona]
      summary: Reload persona from disk
      description: Hot-reloads all persona files and recomposes the system prompt.
      responses:
        "200":
          description: Reload result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  activePersona:
                    type: string
                  botName:
                    type: string
                  promptLength:
                    type: integer
                  fileCount:
                    type: integer
                  enabledCount:
                    type: integer
                example:
                  success: true
                  activePersona: "wendy"
                  botName: "Wendy"
                  promptLength: 8421
                  fileCount: 6
                  enabledCount: 5

