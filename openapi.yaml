                    parameters:
                      type: "object"
                      properties:
                        action:
                          type: "string"
                          enum: ["list", "create", "complete", "update", "delete"]
                      required: ["action"]
                  - name: "calendar"
                    description: "Query Google Calendar events."
                    enabled: true
                    parameters:
                      type: "object"
                      properties:
                        daysAhead: { type: "integer" }

  /api/tools/{name}:
    get:
      tags: [Tools]
      summary: Get a single tool's details
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: "tasks"
      responses:
        "200":
          description: Tool detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
                example:
                  name: "tasks"
                  description: "Create, list, update, and delete Google Tasks."
                  enabled: true
                  parameters:
                    type: "object"
                    properties:
                      action:
                        type: "string"
                        enum: ["list", "create", "complete", "update", "delete"]
                    required: ["action"]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "Tool not found"

  /api/tools/{name}/execute:
    post:
      tags: [Tools]
      summary: Execute a tool directly
      description: |
        Call any enabled tool with arguments. Uses the same execution path
        as LLM tool calls. Optional channelId and userId provide context
        for scoped tools (memory, notes, etc.).
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: "tasks"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                args:
                  type: object
                  description: Tool arguments (varies per tool, see tool's parameters schema)
                channelId:
                  type: string
                  nullable: true
                  description: Optional channel context for scoped tools
                userId:
                  type: string
                  nullable: true
                  description: Optional user context for scoped tools
              example:
                args:
                  action: "create"
                  title: "Review PR #42"
                  priority: "high"
                channelId: "1234567890123456789"
                userId: "987654321098765432"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tool:
                    type: string
                  result:
                    type: string
                    description: Human-readable text result (always present, backward compatible)
                  data:
                    description: >
                      Structured JSON data for the tool response. Shape varies per tool and action.
                      Present when the tool provides structured output. Omitted on error responses.
                      Typically includes an `action` field and typed result objects.
                example:
                  success: true
                  tool: "tasks"
                  result: "Created task \"Review PR #42\" (id: MTIzNDU2Nzg5MDEyMzQ1Ng)"
                  data:
                    action: "create"
                    task:
                      uid: "MTIzNDU2Nzg5MDEyMzQ1Ng"
                      title: "Review PR #42"
                      priority: "high"
                      completed: false
        "400":
          description: Tool is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "Tool is disabled"
        "404":
          description: Tool not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "Tool not found"

  /api/tools/{name}/toggle:
    post:
      tags: [Tools]
      summary: Toggle a tool on/off
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: "tasks"
      responses:
        "200":
          description: Toggle result
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  enabled:
                    type: boolean
                example:
                  name: "tasks"
                  enabled: false
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "Tool not found"

