  /api/notes/{scope}:
    get:
      tags: [Notes]
      summary: List notes in a scope
      description: Returns all notes within a specific scope (e.g. `global` or `channel:123456`).
      parameters:
        - name: scope
          in: path
          required: true
          schema:
            type: string
