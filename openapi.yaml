  # â”€â”€ System â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/heartbeat:
    get:
      tags: [System]
      summary: Heartbeat state
      description: Returns heartbeat status and registered handler list.
      responses:
        "200":
          description: Heartbeat info
          content:
            application/json:
              schema:
                type: object
                properties:
                  running:
                    type: boolean
                  intervalMs:
                    type: integer
                    description: Tick interval in milliseconds
                  lastTick:
                    type: string
                    format: date-time
                    nullable: true
                  tickCount:
                    type: integer
                  handlers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        enabled:
                          type: boolean
                example:
                  running: true
                  intervalMs: 900000
                  lastTick: "2026-04-18T14:30:00.000Z"
                  tickCount: 48
                  handlers:
                    - name: "calendar"
                      description: "Google Calendar reminder heartbeat"
                      enabled: true
                    - name: "consolidation"
                      description: "Fact consolidation pass via LLM"
                      enabled: true
                    - name: "knowledge-sync"
                      description: "Google Drive KB sync"
                      enabled: true

  /api/emotion:
    get:
      tags: [Emotion]
      summary: Current emotion vector
      description: |
        Returns the bot's current emotional state as a continuous 8-dimensional vector
        derived from Plutchik's wheel. Each dimension is a float from 0.0 to 1.0.

        This endpoint returns a point-in-time snapshot. For real-time updates during
        conversation, listen for `"emotion"` events on the SSE stream (`/api/logs/stream`)
        or WebSocket (`/ws`).

        **Event flow during a conversation:**
        1. User sends message — immediate `source: "user"` reaction from heuristic text analysis
        2. Conversation starts — initial vector broadcast (`source: "stream"`, current mood)
        3. During streaming — heuristic vectors ~1-3x/sec (`source: "stream"`, zero API cost)
        4. After response — LLM-classified vector (`source: "llm"`, high accuracy, 5s cooldown)
      responses:
        "200":
          description: Emotion vector with all 8 Plutchik dimensions as floats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmotionVector"
                example:
                  joy: 0.72
                  trust: 0.54
                  fear: 0.02
                  surprise: 0.08
                  sadness: 0.03
                  disgust: 0.01
                  anger: 0.01
                  anticipation: 0.38

  /api/mood:
    get:
      tags: [System]
      summary: Current mood
      description: |
        Returns the bot's current emotional state using Plutchik's wheel of emotions.
        Updated automatically after each Discord response via mood classification.
        When primary and secondary emotions are adjacent on the wheel, they resolve to a
        named dyad (e.g. joy+trust = love, anger+anticipation = aggressiveness).
      responses:
        "200":
          description: Mood state (active=false when no mood has been set yet)
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                    description: Whether a mood is currently set
                  emotion:
                    type: string
                    enum: [joy, trust, fear, surprise, sadness, disgust, anger, anticipation]
                  intensity:
                    type: string
                    enum: [low, mid, high]
                  label:
                    type: string
                    description: Resolved emotion word (e.g. "serenity" for joy/low)
                  secondary:
                    type: string
                    nullable: true
                    description: Optional secondary emotion for blends (adjacent on wheel)
                  dyad:
                    type: string
                    nullable: true
                    description: Named combination when primary+secondary are adjacent (e.g. "love", "optimism", "awe"). Null when no secondary or pair is not adjacent.
                  note:
                    type: string
                    nullable: true
                    description: Brief context for why mood shifted
                  updatedAt:
                    type: string
                    format: date-time
                example:
                  active: true
                  emotion: "joy"
                  intensity: "mid"
                  label: "joy"
                  secondary: "trust"
                  dyad: "love"
                  note: "User shared good news about a deploy."
                  updatedAt: "2026-04-18T14:32:00.000Z"

    post:
      tags: [System]
      summary: Set or reclassify mood
      description: |
        Manually set the bot's mood or trigger a reclassification from the last conversation.
        Send `reclassify: true` to re-run mood classification on the most recent exchange,
        or provide mood fields to set it directly.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Manual mood set
                  required: [emotion, intensity]
                  properties:
                    emotion:
                      type: string
                      enum: [joy, trust, fear, surprise, sadness, disgust, anger, anticipation]
                    intensity:
                      type: string
                      enum: [low, mid, high]
                    secondary:
                      type: string
                      nullable: true
                      description: Optional secondary emotion
                    note:
                      type: string
                      nullable: true
                      description: Brief context for mood shift
                - type: object
                  description: Reclassify from last conversation
                  required: [reclassify]
                  properties:
                    reclassify:
                      type: boolean
                      enum: [true]
              example:
                emotion: "anticipation"
                intensity: "high"
                secondary: "joy"
                note: "Big demo tomorrow"
      responses:
        "200":
          description: Updated mood state
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                  emotion:
                    type: string
                  intensity:
                    type: string
                  label:
                    type: string
                  secondary:
                    type: string
                    nullable: true
                  note:
                    type: string
                    nullable: true
                  updatedAt:
                    type: string
                    format: date-time
                example:
                  active: true
                  emotion: "anticipation"
                  intensity: "high"
                  label: "vigilance"
                  secondary: "joy"
                  note: "Big demo tomorrow"
                  updatedAt: "2026-04-18T14:32:00.000Z"
        "400":
          description: Missing required fields or invalid values

  /api/logs:
    get:
      tags: [System]
      summary: Recent log entries
      description: Returns the last 200 log entries.
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
                example:
                  - ts: "2026-04-18T14:32:04.102Z"
                    level: "log"
                    message: "[chat] replied to tess in channel:1234567890123456789"
                  - ts: "2026-04-18T14:31:50.001Z"
                    level: "warn"
                    message: "[knowledge] skipping file (no text content): image-only.png"
                  - ts: "2026-04-18T14:30:00.000Z"
                    level: "log"
                    message: "[heartbeat] tick #48 — ran 3 handlers"

  /api/logs/stream:
    get:
      tags: [System]
      summary: Live log stream (SSE)
      description: |
        Server-Sent Events stream of log entries in real time.
        Each event is `data: {"ts": "...", "level": "log", "message": "..."}`.
        Prefer bearer auth when possible. Query-token (`?token=<key>`) remains
        supported for compatibility but is deprecated.
      security:
        - BearerAuth: []
        - QueryToken: []
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"ts":"2026-04-18T14:32:04.102Z","level":"log","message":"[chat] replied to tess"}

                  data: {"ts":"2026-04-18T14:32:05.221Z","level":"log","message":"[memory] saved 1 new fact"}

  /api/reboot:
    post:
      tags: [System]
      summary: Reboot the bot
      description: Triggers a graceful reboot. Response is sent before the process exits.
      responses:
        "200":
          description: Reboot initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                example:
                  success: true
                  message: "Reboot initiated"
        "403":
          description: Sensitive route blocked when API key is unset and request is non-local
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "This route requires either an API key or a local request"

  # â”€â”€ Export â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/export:
    get:
      tags: [Export]
      summary: Export bot data
      description: |
        Returns a JSON bundle of all bot data. Use the `sections` query parameter to
        selectively export specific sections. Response includes a Content-Disposition
        header for browser download.
        Export is rejected with 413 if payload exceeds server size limits.
      parameters:
        - name: sections
          in: query
          schema:
            type: string
          description: "Comma-separated list of sections to include (e.g. `memory,sessions,notes`). Omit for all."
          example: "memory,sessions,notes"
      responses:
        "200":
          description: Data export bundle
          headers:
            Content-Disposition:
              schema:
                type: string
              description: "attachment; filename=aelora-export-YYYY-MM-DD.json"
          content:
            application/json:
              schema:
                type: object
                properties:
                  memory:
                    type: object
                    description: All memory facts by scope
                  sessions:
                    type: array
                    description: All channel sessions
                  notes:
                    type: object
                    description: All notes by scope
                  users:
                    type: object
                    description: All user profiles
                  cron:
                    type: array
                    description: All cron jobs
                  mood:
                    type: object
                    description: Current mood state
                  personas:
                    type: array
                    description: All persona descriptions
                example:
                  memory:
                    "user:987654321098765432":
                      - fact: "Prefers TypeScript over JavaScript for new projects"
                        category: "preference"
                  sessions:
                    - channelId: "1234567890123456789"
                      messageCount: 48
                  notes:
                    "global":
                      "meeting-notes":
                        content: "Q2 roadmap notes..."
                  users:
                    "987654321098765432":
                      username: "tess"
                      messageCount: 412
                  cron:
                    - name: "morning-briefing"
                      enabled: true
                  mood:
                    emotion: "joy"
                    intensity: "mid"
                  personas:
                    - name: "wendy"
                      description: "Warm, detail-loving assistant."
        "403":
          description: Sensitive route blocked when API key is unset and request is non-local
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "This route requires either an API key or a local request"
        "413":
          description: Export payload exceeded server size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "Export exceeds maximum payload size"

  # â”€â”€ Activity â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/activity/config:
