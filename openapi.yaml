          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                example:
                  - id: "issue_01H8XYZ"
                    identifier: "ENG-123"
                    title: "Refactor auth flow"
                    status: "In Progress"
                    priority: 2
                    assignee: "tess@example.com"
                    url: "https://linear.app/team/issue/ENG-123"
                  - id: "issue_01H8ABC"
                    identifier: "ENG-124"
                    title: "Add OTEL tracing"
                    status: "Todo"
                    priority: 3
        "503":
          description: Linear not configured
    post:
      tags: [Linear]
      summary: Create an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team:
                  type: string
                  description: Team key (e.g. "ENG")
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: integer
                  minimum: 0
                  maximum: 4
                  description: "0=none, 1=urgent, 2=high, 3=medium, 4=low"
                dueDate:
                  type: string
                  format: date
                estimate:
                  type: number
                assigneeEmail:
                  type: string
                status:
                  type: string
                labels:
                  type: array
                  items:
                    type: string
                project:
                  type: string
                parentIssueId:
                  type: string
                  description: Issue identifier for creating a sub-issue
              required: [team, title]
              example:
                team: "ENG"
                title: "Add OTEL tracing"
                description: "Instrument the chat endpoint with OpenTelemetry."
                priority: 3
                dueDate: "2026-04-30"
                estimate: 3
                assigneeEmail: "tesselstrom@gmail.com"
                labels: ["observability", "infra"]
                project: "Q2 Roadmap"
      responses:
        "201":
          description: Created issue
          content:
            application/json:
              schema:
                type: object
                example:
                  id: "issue_01H8ABC"
                  identifier: "ENG-124"
                  url: "https://linear.app/team/issue/ENG-124"
        "503":
          description: Linear not configured

  /api/linear/issues/me:
    get:
      tags: [Linear]
      summary: My assigned issues
      parameters:
        - name: status
          in: query
          schema:
            type: string
          example: "In Progress"
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
            maximum: 50
      responses:
        "200":
          description: Issues assigned to the API key owner
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                example:
                  - id: "issue_01H8XYZ"
                    identifier: "ENG-123"
                    title: "Refactor auth flow"
                    status: "In Progress"
                    priority: 2
        "503":
          description: Linear not configured

  /api/linear/issues/{id}:
    get:
      tags: [Linear]
      summary: Get issue detail
      description: Returns full issue detail including description, labels, project, and recent comments.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Issue identifier (e.g. "ENG-123")
          example: "ENG-123"
      responses:
        "200":
          description: Issue detail with comments
          content:
            application/json:
              schema:
                type: object
                example:
                  id: "issue_01H8XYZ"
                  identifier: "ENG-123"
                  title: "Refactor auth flow"
                  description: "Simplify the OAuth2 token-refresh logic..."
                  status: "In Progress"
                  priority: 2
                  assignee: "tess@example.com"
                  labels: ["auth", "refactor"]
                  project: "Q2 Roadmap"
                  comments:
                    - id: "comment_01H8"
                      body: "First pass is up for review."
                      createdAt: "2026-04-17T18:22:00.000Z"
        "503":
          description: Linear not configured
    patch:
      tags: [Linear]
      summary: Update an issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "ENG-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: integer
                dueDate:
                  type: string
                estimate:
                  type: number
                assigneeEmail:
                  type: string
                status:
                  type: string
                labels:
                  type: array
                  items:
                    type: string
                project:
                  type: string
              example:
                status: "Done"
                labels: ["auth", "refactor", "shipped"]
      responses:
        "200":
          description: Updated issue
          content:
            application/json:
              schema:
                type: object
                example:
                  id: "issue_01H8XYZ"
                  identifier: "ENG-123"
                  status: "Done"
        "503":
          description: Linear not configured
    delete:
      tags: [Linear]
      summary: Delete an issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "ENG-123"
      responses:
        "200":
          description: Deleted issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
                example:
                  success: true
        "503":
          description: Linear not configured

  /api/linear/issues/{id}/sub-issues:
    get:
      tags: [Linear]
      summary: List sub-issues
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Parent issue identifier
          example: "ENG-123"
      responses:
        "200":
          description: Child issues of the parent
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                example:
                  - id: "issue_01H8DEF"
                    identifier: "ENG-125"
                    title: "Migrate existing sessions"
                    status: "Todo"
        "503":
          description: Linear not configured

  /api/linear/issues/{id}/comments:
    post:
      tags: [Linear]
      summary: Add comment to an issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "ENG-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
