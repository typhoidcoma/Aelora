  # —— Knowledge Base ————————————————————

  /api/knowledge:
    get:
      tags: [Knowledge Base]
      summary: Knowledge base status
      description: Returns knowledge base stats including file count, chunk count, last sync time, and per-file metadata.
      responses:
        "200":
          description: Knowledge base statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  fileCount:
                    type: integer
                  chunkCount:
                    type: integer
                  lastSyncAt:
                    type: string
                    nullable: true
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        fileId:
                          type: string
                        name:
                          type: string
                        mimeType:
                          type: string
                        chunkCount:
                          type: integer
                        lastSyncedAt:
                          type: string
                example:
                  enabled: true
                  fileCount: 12
                  chunkCount: 248
                  lastSyncAt: "2026-04-18T14:00:00.000Z"
                  files:
                    - fileId: "1abc...xyz"
                      name: "Team Handbook.gdoc"
                      mimeType: "application/vnd.google-apps.document"
                      chunkCount: 42
                      lastSyncedAt: "2026-04-18T14:00:00.000Z"
                    - fileId: "1def...uvw"
                      name: "API Spec.pdf"
                      mimeType: "application/pdf"
                      chunkCount: 18
                      lastSyncedAt: "2026-04-18T14:00:00.000Z"

  /api/knowledge/sync:
    post:
      tags: [Knowledge Base]
      summary: Trigger knowledge base sync
      description: Starts a sync of the configured Google Drive folder. Re-indexes new and modified files, removes deleted ones.
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  added:
                    type: integer
                  updated:
                    type: integer
                  removed:
                    type: integer
                example:
                  success: true
                  added: 2
                  updated: 1
                  removed: 0
        "503":
          description: Knowledge base not enabled or vector store not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: "Knowledge base is not enabled"

  /api/knowledge/files/{fileId}/chunks:
    get:
      tags: [Knowledge Base]
      summary: List chunks for a file
      description: Returns all indexed chunks for a specific knowledge base file.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
          description: Google Drive file ID
          example: "1abc...xyz"
      responses:
        "200":
          description: File chunks
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileId:
                    type: string
                  chunks:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                        index:
                          type: integer
                example:
                  fileId: "1abc...xyz"
                  chunks:
                    - index: 0
                      text: "# Team Handbook\n\nWelcome to Aelora. This handbook outlines our engineering practices..."
                    - index: 1
                      text: "## Code review\n\nAll PRs require one approval and passing CI..."

  /api/knowledge/files/{fileId}:
    delete:
      tags: [Knowledge Base]
      summary: Delete a knowledge base file
      description: Removes a file and all its chunks from the knowledge base index.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
          description: Google Drive file ID
          example: "1abc...xyz"
      responses:
        "200":
          description: File removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  chunksRemoved:
                    type: integer
                example:
                  success: true
                  chunksRemoved: 42
        "404":
          description: File not found in knowledge base
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: "File not found in knowledge base"

  # —— Ambient Awareness ————————————————

  /api/ambient/status:
    get:
      tags: [Ambient]
      summary: Ambient engine status
      description: Returns the ambient engine state including trigger stats, cooldowns, and buffer statistics.
      responses:
        "200":
          description: Engine state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  evaluationIntervalMs:
                    type: integer
                  globalSendsLastHour:
                    type: integer
                  globalRateLimitPerHour:
                    type: integer
                  triggers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        enabled:
                          type: boolean
                        cooldownMinutes:
                          type: number
                        skipChance:
                          type: number
                        lastFiredAt:
                          type: string
                          nullable: true
                        lastEvaluatedAt:
                          type: string
                          nullable: true
                        cooldownRemaining:
                          type: integer
                          description: Seconds remaining on cooldown
                        evaluated:
                          type: integer
                        fired:
                          type: integer
                        skipped:
                          type: integer
                  bufferStats:
                    type: array
                    items:
                      $ref: "#/components/schemas/BufferStats"
                example:
                  enabled: true
                  evaluationIntervalMs: 60000
                  globalSendsLastHour: 2
                  globalRateLimitPerHour: 6
                  triggers:
                    - name: "converse"
                      description: "Join a lively channel conversation"
                      enabled: true
                      cooldownMinutes: 30
                      skipChance: 0.3
                      lastFiredAt: "2026-04-18T13:15:00.000Z"
                      lastEvaluatedAt: "2026-04-18T14:30:00.000Z"
                      cooldownRemaining: 1200
                      evaluated: 14
                      fired: 1
                      skipped: 4
                  bufferStats:
                    - channelId: "1234567890123456789"
                      channelName: "general"
                      messageCount: 9
                      oldestMessage: 1745003100
                      newestMessage: 1745004321
                      lastAmbientSendAt: 1744998900

  /api/ambient/buffers:
    get:
      tags: [Ambient]
      summary: Channel buffer stats
      description: Returns per-channel buffer statistics (message counts, timestamps, last ambient send).
      responses:
        "200":
          description: Buffer stats array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BufferStats"
                example:
                  - channelId: "1234567890123456789"
                    channelName: "general"
                    messageCount: 9
                    oldestMessage: 1745003100
                    newestMessage: 1745004321
                    lastAmbientSendAt: 1744998900

  /api/ambient/triggers/{name}/toggle:
    post:
      tags: [Ambient]
      summary: Toggle an ambient trigger
      description: Enable or disable an ambient trigger at runtime. Override persists until bot restart.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Trigger name (e.g. "converse", "image-react")
          example: "converse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required: [enabled]
              example:
                enabled: false
      responses:
        "200":
          description: Trigger toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  enabled:
                    type: boolean
                example:
                  name: "converse"
                  enabled: false
        "400":
          description: Missing enabled field
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: "enabled is required (boolean)"
        "404":
          description: Trigger not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: "Trigger not found"

