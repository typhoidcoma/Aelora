  /api/notes/{scope}/{title}:
    get:
      tags: [Notes]
      summary: Get a single note
      parameters:
        - name: scope
          in: path
          required: true
          schema:
            type: string
          example: "global"
        - name: title
          in: path
          required: true
          schema:
            type: string
          example: "meeting-notes"
      responses:
        "200":
          description: The requested note
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: string
                  title:
                    type: string
                  content:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                example:
                  scope: "global"
                  title: "meeting-notes"
                  content: "Q2 roadmap kickoff - key themes: reliability, performance"
                  createdAt: "2026-04-17T15:00:00.000Z"
                  updatedAt: "2026-04-17T15:30:00.000Z"
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: "Note not found"

    put:
      tags: [Notes]
      summary: Create or update a note
      parameters:
        - name: scope
          in: path
          required: true
          schema:
            type: string
          example: "global"
        - name: title
          in: path
          required: true
          schema:
            type: string
          example: "meeting-notes"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: The note content
              example:
                content: "Q2 roadmap kickoff - reliability, performance, cost efficiency"
      responses:
        "200":
          description: Note created or updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope:
                    type: string
                  title:
                    type: string
                  content:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  created:
                    type: boolean
                    description: True if newly created, false if updated
                example:
                  scope: "global"
                  title: "meeting-notes"
                  content: "Q2 roadmap kickoff - reliability, performance, cost efficiency"
                  createdAt: "2026-04-17T15:00:00.000Z"
                  updatedAt: "2026-04-18T14:32:00.000Z"
                  created: false
        "400":
          description: Missing content
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: "content is required"

    delete:
      tags: [Notes]
      summary: Delete a note
      parameters:
        - name: scope
          in: path
          required: true
          schema:
            type: string
          example: "global"
        - name: title
          in: path
          required: true
          schema:
            type: string
          example: "meeting-notes"
      responses:
        "200":
          description: Note deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                example:
                  success: true
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: "Note not found"

  # â”€â”€ Calendar â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/calendar/events:
    get:
      tags: [Calendar]
      summary: List upcoming events
      description: Returns upcoming events from the Google Calendar API.
      parameters:
        - name: maxResults
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Maximum number of events to return
        - name: daysAhead
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 14
          description: How many days ahead to query
      responses:
        "200":
          description: List of upcoming events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/CalendarEvent"
                  count:
                    type: integer
                  daysAhead:
                    type: integer
                  maxResults:
                    type: integer
                example:
                  events:
                    - uid: "evt_abcdef1234"
                      summary: "Team standup"
                      description: "Daily sync"
                      location: "Zoom"
                      dtstart: "2026-04-19T16:00:00.000Z"
                      dtend: "2026-04-19T16:15:00.000Z"
                      url: "https://www.google.com/calendar/event?eid=..."
                      etag: "\"3382419800000000\""
                    - uid: "evt_ghijkl5678"
                      summary: "Q2 Roadmap review"
                      dtstart: "2026-04-19T21:00:00.000Z"
                      dtend: "2026-04-19T22:00:00.000Z"
                      url: "https://www.google.com/calendar/event?eid=..."
                      etag: "\"3382419900000000\""
                  count: 2
                  daysAhead: 14
                  maxResults: 10
        "502":
          description: Google Calendar API error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: "Calendar error: Network request failed"
        "503":
          description: Google Calendar not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: "Google Calendar is not configured"

  /api/calendar/all-events:
    get:
      tags: [Calendar]
      summary: List events from all user calendars
      description: |
        Aggregates upcoming events across all registered users' calendars.
        Returns a merged, chronologically sorted list. Does not require a user ID.
      parameters:
        - name: maxResults
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Maximum total events to return (across all users)
        - name: daysAhead
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 14
          description: How many days ahead to query
      responses:
        "200":
          description: Aggregated event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        uid:
                          type: string
                        summary:
                          type: string
                        description:
                          type: string
                        location:
                          type: string
                        dtstart:
                          type: string
                        dtend:
                          type: string
                        user:
                          type: object
                          properties:
                            userId:
                              type: string
                            username:
                              type: string
                  count:
                    type: integer
                  daysAhead:
                    type: integer
                example:
                  events:
                    - uid: "evt_abcdef1234"
                      summary: "Team standup"
                      dtstart: "2026-04-19T16:00:00.000Z"
                      dtend: "2026-04-19T16:15:00.000Z"
                      user:
                        userId: "987654321098765432"
                        username: "tess"
                  count: 1
                  daysAhead: 14
        "404":
          description: Calendar tool not enabled
        "500":
          description: Calendar query failed
        "503":
          description: Google not configured

  # â”€â”€ Tasks (Google Tasks) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/tasks:
    get:
      tags: [Tasks]
      summary: List all tasks
      description: |
        Returns tasks from Google Tasks for the user identified by
        `X-Discord-User-Id` header (or `?userId=` query param). Filter by status.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, completed]
            default: all
        - name: X-Discord-User-Id
          in: header
          required: false
          schema:
            type: string
          description: Discord user ID for per-user task list scoping. Required unless `?userId=` is used.
          example: "987654321098765432"
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TodoItem"
                  count:
                    type: integer
                example:
                  tasks:
                    - uid: "MTIzNDU2Nzg5MDEyMzQ1Ng"
                      title: "Review PR #42"
                      description: "Check the new auth flow"
                      completed: false
                      priority: "high"
                      dueDate: "2026-04-19T17:00:00.000Z"
                      url: "https://tasks.google.com/task/MTIzNDU2Nzg5MDEyMzQ1Ng"
                      etag: "\"LTEyMzQ1Njc4OTA\""
                      createdAt: "2026-04-18T09:00:00.000Z"
                      updatedAt: "2026-04-18T14:32:00.000Z"
                    - uid: "Nzg5MDEyMzQ1NjA"
                      title: "Reply to Sarah's email"
                      completed: false
                      priority: "medium"
                      dueDate: null
                      url: "https://tasks.google.com/task/Nzg5MDEyMzQ1NjA"
                      etag: "\"LTk4NzY1NDMyMTA\""
                      createdAt: "2026-04-17T10:15:00.000Z"
                      updatedAt: "2026-04-17T10:15:00.000Z"
                  count: 2
        "502":
          description: Google API connection error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "Tasks error: Network request failed"
        "503":
          description: Google not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "Google Tasks is not configured"
    post:
      tags: [Tasks]
      summary: Create a new task
      parameters:
        - name: X-Discord-User-Id
          in: header
          required: false
          schema:
            type: string
          description: Discord user ID for per-user task list scoping.
          example: "987654321098765432"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum: [low, medium, high]
                dueDate:
                  type: string
                  format: date-time
              required: [title]
              example:
                title: "Review PR #42"
                description: "Check the new auth flow"
                priority: "high"
                dueDate: "2026-04-19T17:00:00.000Z"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoItem"
                example:
                  uid: "MTIzNDU2Nzg5MDEyMzQ1Ng"
                  title: "Review PR #42"
                  description: "Check the new auth flow"
                  completed: false
                  priority: "high"
                  dueDate: "2026-04-19T17:00:00.000Z"
                  url: "https://tasks.google.com/task/MTIzNDU2Nzg5MDEyMzQ1Ng"
                  etag: "\"LTEyMzQ1Njc4OTA\""
                  createdAt: "2026-04-18T14:32:00.000Z"
                  updatedAt: "2026-04-18T14:32:00.000Z"
        "400":
          description: Missing title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "title is required"
        "502":
          description: Google API connection error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

