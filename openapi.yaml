          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "This route requires either an API key or a local request"
    put:
      tags: [Persona]
      summary: Update a persona file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                content:
                  type: string
