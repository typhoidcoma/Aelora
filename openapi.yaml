        "403":
          description: Sensitive route blocked when API key is unset and request is non-local
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "This route requires either an API key or a local request"

  # â”€â”€ Chat â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/chat:
    post:
      tags: [Chat]
      summary: Send a message
      description: |
        Send a message and receive a response with full conversation state.
        Uses `sessionId` to maintain conversation history across requests.
        Optionally provide `userId` and `username` to enable user-scoped memory and session tracking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, sessionId]
              properties:
                message:
                  type: string
                  description: The user's message
                sessionId:
                  type: string
                  description: Conversation identifier (maps to internal channelId)
                userId:
                  type: string
                  description: Optional user identifier for memory and tracking
                username:
                  type: string
                  description: Optional display name (required if userId is provided)
              example:
                message: "What's on my plate tomorrow?"
                sessionId: "web-2026-04-18-tess"
                userId: "987654321098765432"
                username: "tess"
      responses:
        "200":
          description: Bot response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                  sessionId:
                    type: string
                example:
                  reply: "Tomorrow you have a 9am standup and the Q2 roadmap review at 2pm."
                  sessionId: "web-2026-04-18-tess"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: "sessionId is required"

  /api/chat/stream:
    post:
      tags: [Chat]
      summary: Send a message (streaming)
      description: |
        Same as POST /api/chat but streams tokens via Server-Sent Events.
        Each token is sent as `data: {"token":"..."}`.
        Final event is `data: {"done":true,"reply":"..."}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, sessionId]
              properties:
                message:
                  type: string
                sessionId:
                  type: string
                userId:
                  type: string
                username:
                  type: string
              example:
                message: "Write a haiku about debugging"
                sessionId: "web-2026-04-18-tess"
                userId: "987654321098765432"
                username: "tess"
      responses:
        "200":
          description: SSE stream of tokens
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"token":"Stack"}

                  data: {"token":" trace"}

                  data: {"token":" blooms"}

                  data: {"done":true,"reply":"Stack trace blooms /  ..."}
        "413":
          description: Message too large (max server-side length exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "message exceeds maximum length"

  /api/chat/system:
    post:
      tags: [Chat]
      summary: Send a system directive (frontend-issued instruction)
      description: |
        Run an LLM turn driven by a frontend-issued **system directive** rather than a user message.
        The directive is injected as a `role:"system"` instruction after the conversation history,
        so the model treats it as the system telling the assistant what to do — not as the user asking.

        Use cases: proactive greetings on app load, contextual nudges driven by frontend state,
        persona-voice openers. Combine with `POST /api/persona/switch` to pre-select the voice.

        Side effects (intentionally narrower than `/api/chat`): no fact extraction, no mood
        classification, no user/session identity recording. The assistant reply IS appended to
        history so subsequent user turns retain continuity. No user-role message is ever stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [directive, sessionId]
              properties:
                directive:
                  type: string
                  description: Instruction for the assistant, framed as a system directive (e.g. "Greet the user warmly as if they just opened the app").
                sessionId:
                  type: string
                  description: Conversation identifier (maps to internal channelId)
                userId:
                  type: string
                  description: Optional user identifier so persona/profile context is loaded for the response
              example:
                directive: "Greet the user warmly as if they just opened the app."
                sessionId: "web-2026-04-18-tess"
                userId: "987654321098765432"
      responses:
        "200":
          description: Bot response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                  sessionId:
                    type: string
                example:
                  reply: "Hey tess! Great to see you back. Ready to tackle the day?"
                  sessionId: "web-2026-04-18-tess"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "directive is required"
        "413":
          description: Directive too large (max server-side length exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "directive exceeds maximum length"

  /api/chat/system/stream:
    post:
      tags: [Chat]
      summary: Send a system directive (streaming)
      description: |
        Streaming variant of `POST /api/chat/system`. Tokens stream via Server-Sent Events.
        Each token is sent as `data: {"token":"..."}`. Final event is `data: {"done":true,"reply":"..."}`.
        On error: `data: {"error":"..."}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [directive, sessionId]
              properties:
                directive:
                  type: string
                sessionId:
                  type: string
                userId:
                  type: string
              example:
                directive: "Provide a short end-of-day summary based on today's activity."
                sessionId: "web-2026-04-18-tess"
                userId: "987654321098765432"
      responses:
        "200":
          description: SSE stream of tokens
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"token":"Today"}

                  data: {"token":" you"}

                  data: {"done":true,"reply":"Today you shipped 3 PRs and closed 4 tasks."}
        "413":
          description: Directive too large (max server-side length exceeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "directive exceeds maximum length"

  /api/chat/{sessionId}:
    delete:
      tags: [Chat]
      summary: Start new session
      description: Full session reset. Clears conversation history, summary, compaction queue, and session stats. The next message starts fresh.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
          description: The session to reset
          example: "web-2026-04-18-tess"
      responses:
        "200":
          description: Session reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                example:
                  success: true

  # â”€â”€ Cron â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /api/cron:
    get:
      tags: [Cron]
      summary: List all cron jobs
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CronJob"
                example:
                  - name: "morning-briefing"
                    schedule: "0 9 * * *"
                    timezone: "America/Los_Angeles"
                    channelId: "1234567890123456789"
                    type: "llm"
                    prompt: "Summarize today's calendar and top 3 tasks."
                    enabled: true
                    silent: false
                    lastRun: "2026-04-18T09:00:04.521Z"
                    nextRun: "2026-04-19T09:00:00.000Z"
                    lastError: null
                  - name: "daily-summary"
                    schedule: "0 18 * * *"
                    timezone: "America/Los_Angeles"
                    channelId: "1234567890123456789"
                    type: "static"
                    message: "End of day. Reviewing progress..."
                    enabled: true
                    silent: false
                    lastRun: null
                    nextRun: "2026-04-18T18:00:00.000Z"
    post:
      tags: [Cron]
      summary: Create a cron job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                schedule:
                  type: string
                timezone:
                  type: string
                channelId:
                  type: string
                  description: Required unless silent is true
                type:
                  type: string
                  enum: [static, llm]
                message:
                  type: string
                prompt:
                  type: string
                enabled:
                  type: boolean
                silent:
                  type: boolean
                  description: Run without sending output to Discord
              required: [name, schedule, type]
              example:
                name: "morning-briefing"
                schedule: "0 9 * * *"
                timezone: "America/Los_Angeles"
                channelId: "1234567890123456789"
                type: "llm"
                prompt: "Summarize today's calendar and top 3 tasks."
                enabled: true
                silent: false
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
                example:
                  success: true
                  name: "morning-briefing"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: "schedule is required"

  /api/cron/{name}:
    put:
      tags: [Cron]
      summary: Update a cron job
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: "morning-briefing"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule:
                  type: string
                timezone:
                  type: string
                channelId:
                  type: string
                type:
                  type: string
                  enum: [static, llm]
                message:
                  type: string
                prompt:
                  type: string
                silent:
                  type: boolean
              example:
                schedule: "30 8 * * *"
                prompt: "Give me a warm morning greeting, today's weather, and my top 3 tasks."
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
                example:
                  success: true
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: 'Job "morning-briefing" not found'
    delete:
      tags: [Cron]
      summary: Delete a cron job
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: "morning-briefing"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
                example:
                  success: true
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: 'Job "morning-briefing" not found'

  /api/cron/{name}/toggle:
    post:
      tags: [Cron]
      summary: Toggle a cron job on/off
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: "morning-briefing"
      responses:
        "200":
          description: Toggle result
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  enabled:
                    type: boolean
                example:
                  name: "morning-briefing"
                  enabled: false
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: 'Job "morning-briefing" not found'

  /api/cron/{name}/trigger:
    post:
      tags: [Cron]
      summary: Manually trigger a cron job
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: "morning-briefing"
      responses:
        "200":
          description: Trigger result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  output:
                    type: string
                  error:
                    type: string
                example:
                  success: true
                  output: "Good morning! You have a standup at 9am and 3 tasks due today."
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
                example:
                  error: 'Job "morning-briefing" not found'

